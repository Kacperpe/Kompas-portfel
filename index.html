<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b57">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Kompas Portfela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: brokerage ledger — sticky tab bar, summary strip, then one working table per tab */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e3e9e7; --line:#cfd8d5;
  --fg:#14211e; --muted:#5b6b67; --accent:#0d6b57; --accent-fg:#ffffff;
  --good:#1a7f4b; --bad:#b4352a; --warn:#a86a00; --warn-bg:#fbefd6; --bad-bg:#f8e1de; --good-bg:#dcf1e4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --surface:#132120; --sunk:#0f1b1a; --line:#24363a;
  --fg:#e3ecea; --muted:#8fa29e; --accent:#3fc9a4; --accent-fg:#06221b;
  --good:#4fd08a; --bad:#ff7a6c; --warn:#f0b43c; --warn-bg:#3a2c0e; --bad-bg:#3a1714; --good-bg:#0f3322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --surface:#132120; --sunk:#0f1b1a; --line:#24363a;
  --fg:#e3ecea; --muted:#8fa29e; --accent:#3fc9a4; --accent-fg:#06221b;
  --good:#4fd08a; --bad:#ff7a6c; --warn:#f0b43c; --warn-bg:#3a2c0e; --bad-bg:#3a1714; --good-bg:#0f3322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.store{font-size:12px;color:var(--muted);font-family:var(--mono)}
.spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 14px var(--body);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
select,input,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 14px var(--body);border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.danger{color:var(--bad)}
main{padding-block:24px 64px;display:grid;gap:24px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500}
.kpi .s{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.tk{font-family:var(--mono);font-weight:500}
.sub{display:block;font-size:12px;color:var(--muted);white-space:normal;max-width:220px}
.pill{display:inline-block;font:500 11px var(--mono);padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.buy{background:var(--good-bg);color:var(--good)}.pill.sell{background:var(--bad-bg);color:var(--bad)}
.pill.in{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.cell-in{width:110px;padding:5px 8px;text-align:right;font-family:var(--mono)}
.alloc-bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.alloc-bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dev{position:relative;height:8px;background:var(--sunk);border-radius:4px;width:140px}
.dev .band{position:absolute;top:0;bottom:0;background:var(--good-bg)}
.dev .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.dev .dot{position:absolute;top:-2px;width:12px;height:12px;border-radius:50%;margin-left:-6px;background:var(--accent)}
.dev .dot.out{background:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);padding:20px;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,15,13,.5)}
.health{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px}
.dot-ok{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.dot-off{background:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wbar{display:block;height:4px;border-radius:2px;background:var(--sunk);margin-top:4px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.split .a{background:var(--accent)}.split .b{background:var(--good);opacity:.55}
.split-legend{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.fab{display:none}
.toast{display:flex;align-items:center;gap:12px}
.toast button{background:none;border:0;color:var(--bg);font:600 14px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.calc{display:grid;gap:10px;background:var(--sunk);border-radius:8px;padding:14px}
.form .full{grid-column:1/-1}
.mono-in{font-family:var(--mono)}
@media (max-width:720px){
  .hide-sm{display:none}
  .bar{gap:10px}
  .bar #addTxBtn{display:none}
  .fab{display:flex;align-items:center;justify-content:center;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font:500 28px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:15;cursor:pointer}
  main{padding-bottom:96px}
  .kpi .v{font-size:18px}.dev{width:90px}
  dialog{margin:auto 0 0;width:100vw;max-width:100vw;max-height:92vh;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .form{grid-template-columns:1fr 1fr}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>Kompas Portfela</div>
      <span class="store" id="storeInfo"><span class="dot-ok dot-off"></span>łączenie…</span>
      <span class="spacer"></span>
      <label class="row note" for="acctFilter">Konto
        <select id="acctFilter"><option value="">Wszystkie</option></select>
      </label>
      <button class="btn primary" id="addTxBtn">+ Transakcja</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Przegląd</button>
      <button role="tab" data-tab="positions" aria-selected="false">Pozycje</button>
      <button role="tab" data-tab="txs" aria-selected="false">Transakcje</button>
      <button role="tab" data-tab="alloc" aria-selected="false">Alokacja i rebalancing</button>
      <button role="tab" data-tab="settings" aria-selected="false">Kursy i import</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<button class="fab" id="fab" aria-label="Dodaj transakcję">+</button>

<dialog id="txDlg">
  <form id="txForm" method="dialog" class="form">
    <h2 class="wide" id="txTitle">Dodaj transakcję</h2>
    <div class="wide chips" id="typeChips" role="group" aria-label="Typ transakcji"></div>
    <label hidden>Typ<select id="f_type">
      <option value="buy">Kupno</option><option value="sell">Sprzedaż</option>
      <option value="deposit">Wpłata</option><option value="withdrawal">Wypłata</option>
      <option value="dividend">Dywidenda</option><option value="interest">Odsetki</option>
      <option value="fee">Opłata</option><option value="fx">Wymiana walut</option>
    </select></label>
    <label>Data<input type="date" id="f_date" required></label>
    <label>Konto / broker<input id="f_account" list="acctList" placeholder="np. mBank"></label>
    <label data-for="trade income">Ticker<input id="f_ticker" list="tickerList" placeholder="np. AAPL" autocapitalize="characters"></label>
    <label data-for="trade">Nazwa<input id="f_name" placeholder="opcjonalnie"></label>
    <label>Waluta<select id="f_ccy"></select></label>
    <label data-for="trade">Jednostki<input id="f_qty" inputmode="decimal"></label>
    <label data-for="trade">Cena<input id="f_price" inputmode="decimal"></label>
    <label data-for="trade">Prowizja<input id="f_fee" inputmode="decimal" placeholder="0"></label>
    <label data-for="cash income fx">Kwota<input id="f_amount" inputmode="decimal"></label>
    <label data-for="income">Podatek pobrany<input id="f_tax" inputmode="decimal" placeholder="0"></label>
    <label data-for="fx">Na walutę<select id="f_toCcy"></select></label>
    <label data-for="fx">Otrzymano<input id="f_toAmount" inputmode="decimal"></label>
    <label>Kurs do PLN<input id="f_fx" inputmode="decimal" placeholder="1 dla PLN"></label>
    <label class="wide">Notatka<input id="f_note"></label>
    <p class="wide note" id="txPreview"></p>
    <p class="wide note neg" id="txErr" hidden></p>
    <div class="wide row"><span class="spacer"></span>
      <button type="button" class="btn" id="txCancel">Anuluj</button>
      <button type="submit" class="btn primary" id="txSave">Zapisz</button></div>
  </form>
</dialog>
<datalist id="acctList"></datalist>
<datalist id="tickerList"></datalist>

<script>
(() => {
const CCYS = ["PLN","USD","EUR","GBP","CHF"];
const TYPE_LABEL = {buy:"Kupno",sell:"Sprzedaż",deposit:"Wpłata",withdrawal:"Wypłata",dividend:"Dywidenda",interest:"Odsetki",fee:"Opłata",fx:"Wymiana"};
const PALETTE = ["#0d6b57","#3a7bd5","#c46b2d","#8a5cc2","#c23b6b","#2a9d8f","#b8952a","#5c6f8a","#d4573b","#4f9a3a"];
const fmt = (n, d=2) => (isFinite(n)?n:0).toLocaleString("pl-PL",{minimumFractionDigits:d,maximumFractionDigits:d});
const money = (n, c="PLN") => fmt(n) + " " + c;
const pct = n => (n>=0?"+":"") + fmt(n*100) + "%";
const num = v => { if (v===undefined||v===null||v==="") return 0; const x = parseFloat(String(v).replace(/\s/g,"").replace(",", ".")); return isFinite(x)?x:0; };
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let txs = [];
let settings = { fxRates:{PLN:1,USD:3.65,EUR:4.25,GBP:4.85,CHF:4.55}, prices:{}, targets:{}, band:5 };
let tab = "overview", acct = "", editing = null, store = null;

/* ---------- storage: db (per-person, private) with localStorage fallback ---------- */
const LS = "kompas-portfela-v1";
function lsLoad(){ try { const j = JSON.parse(localStorage.getItem(LS)||"null"); if (j){ txs=j.txs||[]; Object.assign(settings,j.settings||{}); } } catch(e){} }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify({txs,settings})); } catch(e){} }

const Local = { name:"lokalnie (ta przeglądarka)",
  async putTx(t){ const i=txs.findIndex(x=>x.id===t.id); if(i>=0) txs[i]=t; else txs.push(t); lsSave(); render(); },
  async delTx(id){ txs=txs.filter(x=>x.id!==id); lsSave(); render(); },
  async saveSettings(){ lsSave(); } };

async function connectDb(){
  if (!window.claude || !window.claude.use) return null;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return null;
  const id = await user.id(); if (!id) return null;
  const base = "data/users/" + id;
  const col = db.collection(base + "/p/tx");
  const sdoc = db.doc(base + "/settings");
  let sChain = Promise.resolve(), sTimer = null;
  const api = { name:"zapisane na koncie (prywatne)",
    async putTx(t){ await col.doc(t.id).set(t); },
    async delTx(id){ await col.doc(id).delete(); },
    async saveSettings(){ clearTimeout(sTimer); sTimer = setTimeout(()=>{ const snap = JSON.parse(JSON.stringify(settings)); sChain = sChain.then(()=>sdoc.set(snap)).catch(e=>toast("Nie zapisano ustawień: "+(e.message||e.code))); }, 600); } };
  try { const s = await sdoc.get(); if (s.exists && s.data()) Object.assign(settings, s.data()); } catch(e){}
  let loaded = false;
  const t = setTimeout(()=>{ if(!loaded){ setStore("brak połączenia, dane mogą być nieaktualne",false); } }, 10000);
  col.orderBy("date").limit(1000).onSnapshot(snap => {
    txs = snap.docs.map(d=>d.data()).filter(Boolean);
    if (!snap.metadata || !snap.metadata.fromCache){ loaded = true; clearTimeout(t); setStore(api.name,true); }
    render();
  }, err => { clearTimeout(t); setStore("błąd zapisu: " + (err.message||err.code),false); });
  return api;
}

function setStore(t, ok){ const el=document.getElementById("storeInfo"); el.innerHTML=`<span class="dot-ok ${ok?"":"dot-off"}"></span>`; el.append(t); }

/* ---------- engine ---------- */
function compute(list){
  const sorted = [...list].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
  const pos = {}, cash = {}, warn = [];
  let depositsPLN = 0, realizedPLN = 0, incomePLN = 0, feesPLN = 0;
  const addCash = (c,v) => { cash[c] = (cash[c]||0) + v; };
  for (const t of sorted){
    const fx = num(t.fx) || (t.ccy==="PLN"?1:(settings.fxRates[t.ccy]||1));
    const qty=num(t.qty), price=num(t.price), fee=num(t.fee), amt=num(t.amount), tax=num(t.tax);
    switch(t.type){
      case "deposit": addCash(t.ccy, amt); depositsPLN += amt*fx; break;
      case "withdrawal": addCash(t.ccy, -amt); depositsPLN -= amt*fx; break;
      case "fee": addCash(t.ccy, -amt); feesPLN += amt*fx; break;
      case "dividend": case "interest": addCash(t.ccy, amt-tax); incomePLN += (amt-tax)*fx; break;
      case "fx": addCash(t.ccy, -amt); addCash(t.toCcy, num(t.toAmount)); break;
      case "buy": {
        const k = t.ticker.toUpperCase();
        const p = pos[k] ||= {ticker:k, name:t.name||k, ccy:t.ccy, units:0, costCcy:0, costPLN:0, income:0};
        if (t.name) p.name = t.name;
        p.units += qty; p.costCcy += qty*price+fee; p.costPLN += (qty*price+fee)*fx;
        addCash(t.ccy, -(qty*price+fee)); feesPLN += fee*fx; break; }
      case "sell": {
        const k = t.ticker.toUpperCase(); const p = pos[k];
        if (!p || p.units < qty - 1e-9){ warn.push(`${t.date}: sprzedaż ${qty} ${k}, a w portfelu jest ${p?fmt(p.units,4):0}`); }
        if (p && p.units>0){ const share = Math.min(qty/p.units,1);
          const cPLN = p.costPLN*share; realizedPLN += (qty*price-fee)*fx - cPLN;
          p.costCcy -= p.costCcy*share; p.costPLN -= cPLN; p.units -= qty; if (p.units<1e-9){p.units=0;p.costCcy=0;p.costPLN=0;} }
        addCash(t.ccy, qty*price-fee); feesPLN += fee*fx; break; }
    }
    if ((t.type==="dividend"||t.type==="interest") && t.ticker && pos[t.ticker.toUpperCase()]) pos[t.ticker.toUpperCase()].income += (amt-tax)*fx;
  }
  const rate = c => c==="PLN"?1:num(settings.fxRates[c]);
  const positions = Object.values(pos).filter(p=>p.units>0).map(p => {
    const pr = settings.prices[p.ticker]; const price = pr ? num(pr.price) : (p.units?p.costCcy/p.units:0);
    const valueCcy = p.units*price, valuePLN = valueCcy*rate(p.ccy);
    return {...p, price, priceDate: pr?.date, priced: !!pr, avg: p.costCcy/p.units, valueCcy, valuePLN, gainPLN: valuePLN - p.costPLN};
  }).sort((a,b)=>b.valuePLN-a.valuePLN);
  const cashPLN = Object.entries(cash).reduce((s,[c,v])=>s+v*rate(c),0);
  const posPLN = positions.reduce((s,p)=>s+p.valuePLN,0);
  const value = posPLN + cashPLN;
  for (const [c,v] of Object.entries(cash)) if (v < -0.005) warn.push(`Gotówka ${c} ujemna (${fmt(v)}). Brakuje wpłaty lub wymiany walut.`);
  return {positions, cash, cashPLN, posPLN, value, depositsPLN, realizedPLN, incomePLN, feesPLN, gain: value-depositsPLN, warn};
}

function allocation(st){
  const V = st.value || 0, band = num(settings.band)/100;
  const keys = new Set([...st.positions.map(p=>p.ticker), ...Object.keys(settings.targets).filter(k=>num(settings.targets[k])>0)]);
  keys.add("CASH");
  const rows = [...keys].map(k => {
    const p = st.positions.find(x=>x.ticker===k);
    const cur = k==="CASH" ? st.cashPLN : (p?.valuePLN||0);
    const w = V ? cur/V : 0, tgt = num(settings.targets[k])/100;
    const diffPLN = tgt*V - cur;
    const px = p ? p.price*(p.ccy==="PLN"?1:num(settings.fxRates[p.ccy])) : 0;
    return {k, name: k==="CASH"?"Gotówka":(p?.name||k), ccy:p?.ccy, w, tgt, dev:w-tgt, out: Math.abs(w-tgt) > band, cur, diffPLN, units: px? diffPLN/px : 0};
  }).sort((a,b)=>b.cur-a.cur);
  const sumT = rows.reduce((s,r)=>s+r.tgt,0);
  const totalDev = rows.reduce((s,r)=>s+Math.abs(r.dev),0)/2;
  const health = Math.max(0, Math.round(100 - totalDev*200));
  return {rows, sumT, band, health, outCount: rows.filter(r=>r.out).length};
}

const app = document.getElementById("app");
function filtered(){ return acct ? txs.filter(t=>(t.account||"")===acct) : txs; }
function accounts(){ return [...new Set(txs.map(t=>t.account||"").filter(Boolean))].sort(); }

function render(){
  const accs = accounts();
  const sel = document.getElementById("acctFilter");

function kpis(st, a){
  const ret = st.depositsPLN ? st.gain/st.depositsPLN : 0;
  const cashLines = Object.entries(st.cash).filter(([,v])=>Math.abs(v)>0.005).map(([c,v])=>money(v,c)).join(" · ") || "0,00 PLN";
  return `<section class="kpis">
    <div class="kpi"><span class="eyebrow">Wartość portfela</span><span class="v">${money(st.value)}</span><span class="s">pozycje ${money(st.posPLN)}</span></div>
    <div class="kpi"><span class="eyebrow">Zysk / strata</span><span class="v ${st.gain>=0?"pos":"neg"}">${st.gain>=0?"+":""}${money(st.gain)}</span><span class="s">${pct(ret)} od wpłat netto</span></div>
    <div class="kpi"><span class="eyebrow">Wpłacono netto</span><span class="v">${money(st.depositsPLN)}</span><span class="s">dywidendy i odsetki netto ${money(st.incomePLN)}</span></div>
    <div class="kpi"><span class="eyebrow">Gotówka</span><span class="v">${money(st.cashPLN)}</span><span class="s">${cashLines}</span></div>
  </section>`;
}

function allocBar(a){
  const rows = a.rows.filter(r=>r.w>0.0005);
  return `<div class="alloc-bar">${rows.map((r,i)=>`<span style="width:${r.w*100}%;background:${r.k==="CASH"?"var(--muted)":PALETTE[i%PALETTE.length]}" title="${esc(r.k)} ${fmt(r.w*100)}%"></span>`).join("")}</div>
  <div class="legend">${rows.map((r,i)=>`<span><i style="background:${r.k==="CASH"?"var(--muted)":PALETTE[i%PALETTE.length]}"></i>${esc(r.k==="CASH"?"Gotówka":r.k)} <span class="num">${fmt(r.w*100,1)}%</span></span>`).join("")}</div>`;
}

function ring(score){
  const c = 2*Math.PI*22, col = score>=80?"var(--good)":score>=60?"var(--warn)":"var(--bad)";
  return `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle cx="27" cy="27" r="22" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 27 27)" stroke-linecap="round"/><text x="27" y="31" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="var(--fg)">${score}</text></svg>`;
}

function warnings(st){
  const unpriced = st.positions.filter(p=>!p.priced).map(p=>p.ticker);
  const w = [...st.warn]; if (unpriced.length) w.push(`Brak bieżącej ceny dla: ${unpriced.join(", ")}. Wyceniam po średniej cenie zakupu. Uzupełnij w zakładce Pozycje.`);
  return w.length ? `<section class="panel" style="border-color:var(--warn)"><span class="eyebrow" style="color:var(--warn)">Do sprawdzenia</span>${w.map(x=>`<div class="note">${esc(x)}</div>`).join("")}</section>` : "";
}

function overview(st){
  const a = allocation(st);
  const hasTargets = a.sumT > 0;
  const recent = [...filtered()].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6);
  const dep=Math.max(st.depositsPLN,0), growth=st.value-dep, tot=Math.max(st.value, dep)||1;

function txTable(list, actions=true){
  if (!list.length) return `<p class="note">Brak transakcji.</p>`;
  return `<table><thead><tr><th>Data</th><th>Typ</th><th>Instrument</th><th class="hide-sm">Konto</th><th class="r hide-sm">Jedn.</th><th class="r hide-sm">Cena</th><th class="r">Kwota</th>${actions?"<th></th>":""}</tr></thead><tbody>
  ${list.map(t=>{ const q=num(t.qty), p=num(t.price), f=num(t.fee);
    let amount = t.type==="buy"? -(q*p+f) : t.type==="sell"? q*p-f : ["withdrawal","fee"].includes(t.type)? -num(t.amount) : t.type==="fx"? -num(t.amount) : num(t.amount)-num(t.tax);
    const cls = t.type==="buy"?"buy":t.type==="sell"?"sell":["deposit","dividend","interest"].includes(t.type)?"in":"";
    return `<tr><td class="num">${t.date}</td><td><span class="pill ${cls}">${TYPE_LABEL[t.type]}</span></td>
    <td>${t.ticker?`<span class="tk">${esc(t.ticker.toUpperCase())}</span>${q?`<span class="sub num">${fmt(q,q%1?4:0)} × ${fmt(p)}</span>`:""}`:t.type==="fx"?`${t.ccy} → ${t.toCcy} <span class="num">${fmt(num(t.toAmount))}</span>`:""}${t.note?`<span class="sub">${esc(t.note)}</span>`:""}</td>
    <td class="hide-sm">${esc(t.account||"")}</td><td class="r num hide-sm">${q?fmt(q,q%1?4:0):""}</td><td class="r num hide-sm">${p?fmt(p):""}</td>
    <td class="r num ${amount>=0?"pos":"neg"}">${amount>=0?"+":""}${money(amount,t.ccy)}</td>
    ${actions?`<td class="r"><button class="btn ghost" data-edit="${t.id}">Edytuj</button><button class="btn ghost danger" data-del="${t.id}">Usuń</button></td>`:""}</tr>`;}).join("")}
  </tbody></table>`;
}

let splitAmt = "";
function splitCalc(st, a){
  const amt = num(splitAmt);
  let rows = [];
  if (amt>0){
    const V = st.value + amt;
    const need = a.rows.filter(r=>r.k!=="CASH" && r.tgt>0).map(r=>({...r, need: Math.max(0, r.tgt*V - r.cur)}));
    const totalNeed = need.reduce((x,r)=>x+r.need,0);
    rows = need.filter(r=>r.need>0).map(r=>{ const give = totalNeed ? amt*r.need/totalNeed : 0;
      const p = st.positions.find(x=>x.ticker===r.k); const px = p ? p.price*(p.ccy==="PLN"?1:num(settings.fxRates[p.ccy])) : 0;
      return {k:r.k, give, units: px? Math.floor(give/px*100)/100 : 0, ccy:p?.ccy}; }).sort((x,y)=>y.give-x.give);
  }
  return `<div class="calc"><div class="panel-h"><h3>Rozłóż nową wpłatę</h3><span class="spacer"></span>
    <label class="row note" for="splitIn">Kwota PLN <input id="splitIn" class="cell-in" inputmode="decimal" value="${esc(splitAmt)}" placeholder="np. 2000"></label></div>
    ${amt>0? (rows.length? `<div class="tbl-wrap"><table><thead><tr><th>Kup</th><th class="r">Kwota PLN</th><th class="r">≈ jednostek</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="tk">${esc(r.k)}</td><td class="r num">${fmt(r.give)}</td><td class="r num">${r.units?fmt(r.units, r.units<10?2:0):"brak kursu"}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="note">Wszystko jest powyżej celu. Wpłatę możesz zostawić w gotówce.</p>`)
      : `<p class="note">Wpisz kwotę, a podzielę ją tylko na zakupy niedoważonych pozycji, bez sprzedawania czegokolwiek.</p>`}
  </div>`;
}

  const ty=$("f_type").value, err=$("txErr");
  const t = {id: editing||uid(), created: editing ? (txs.find(x=>x.id===editing)?.created||Date.now()) : Date.now(),
    type:ty, date:$("f_date").value, account:$("f_account").value.trim(), ccy:$("f_ccy").value,
    ticker:$("f_ticker").value.trim().toUpperCase(), name:$("f_name").value.trim(),
    qty:num($("f_qty").value), price:num($("f_price").value), fee:num($("f_fee").value), amount:num($("f_amount").value),
    tax:num($("f_tax").value), fx:$("f_ccy").value==="PLN"?1:num($("f_fx").value), toCcy:$("f_toCcy").value, toAmount:num($("f_toAmount").value), note:$("f_note").value.trim()};
  const msg = !t.date?"Podaj datę." : ["buy","sell"].includes(ty)&&(!t.ticker||!t.qty||!t.price)?"Kupno i sprzedaż wymagają tickera, jednostek i ceny."
    : ["deposit","withdrawal","fee","dividend","interest"].includes(ty)&&!t.amount?"Podaj kwotę." : ty==="fx"&&(!t.amount||!t.toAmount||t.ccy===t.toCcy)?"Wymiana wymaga dwóch różnych walut i obu kwot." : "";
  if (msg){ err.textContent=msg; err.hidden=false; return; }
  if (!t.fx && t.ccy!=="PLN") t.fx = num(settings.fxRates[t.ccy]);
  try { await store.putTx(t); dlg.close(); toast(editing?"Zapisano zmiany":"Dodano transakcję"); }
  catch(e2){ err.textContent = "Nie zapisano: "+(e2.message||e2.code)+". Spróbuj ponownie."; err.hidden=false; }
});

/* ---------- import: CSV / XLS / XLSX / wklejka ---------- */
const FIELDS = ["date","type","account","ticker","name","ccy","qty","price","fee","amount","tax","fx","toCcy","toAmount","note"];
const IMP_FIELDS = [
  ["date","Data",["data","date","czas","time","data transakcji","data operacji","data zlecenia","data realizacji","open time","close time","trade date"]],
  ["type","Typ / kierunek",["typ","type","kierunek","k/s","strona","side","operacja","rodzaj","rodzaj operacji","transakcja","action"]],
  ["ticker","Ticker / walor",["ticker","symbol","walor","instrument","papier","kod","isin"]],
  ["name","Nazwa",["nazwa","name","nazwa waloru","description"]],
  ["qty","Ilość",["ilosc","liczba","volume","wolumen","quantity","qty","jednostki","szt","liczba sztuk","liczba jednostek"]],
  ["price","Cena",["cena","kurs","price","open price","cena jednostkowa","kurs transakcji"]],
  ["fee","Prowizja",["prowizja","oplata","commission","fee","fees"]],
  ["amount","Kwota",["kwota","wartosc","amount","value","wartosc transakcji","netto","brutto","saldo operacji"]],
  ["ccy","Waluta",["waluta","currency","ccy","wal"]],
  ["tax","Podatek",["podatek","tax","withholding","podatek pobrany"]],
  ["fx","Kurs do PLN",["fx","kurs waluty","kurs pln","kurs przeliczenia","exchange rate"]],
  ["account","Konto",["konto","rachunek","account"]],
  ["note","Notatka",["opis","komentarz","comment","note","uwagi","tytul"]]];
const norm = v => String(v??"").toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9/ ]/g," ").replace(/\s+/g," ").trim();
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)||"null"); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

function csvRows(text){
  const first = text.split(/\r?\n/)[0]||"";
  const cnt = ch => first.split(ch).length;
  const sep = cnt("\t")>1 ? "\t" : cnt(";")>cnt(",") ? ";" : ",";
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'&&text[i+1]==='"'){cur+='"';i++;} else if (c==='"') q=false; else cur+=c; }
    else if (c==='"' && cur==="") q=true; else if (c===sep){row.push(cur);cur="";} else if (c==="\n"){row.push(cur);rows.push(row);row=[];cur="";} else if (c!=="\r") cur+=c; }
  if (cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function toCSV(list){
  const q = v => /[",;\n]/.test(String(v??"")) ? `"${String(v).replace(/"/g,'""')}"` : (v??"");
  return [FIELDS.join(","), ...list.map(t=>FIELDS.map(f=>q(t[f])).join(","))].join("\n");
}
function pnum(v){
  if (typeof v==="number") return v;
  let s = String(v??"").replace(/−/g,"-").replace(/[^\d,.\-]/g,""); if (!s) return 0;
  const c=s.lastIndexOf(","), d=s.lastIndexOf(".");
  if (c>-1 && d>-1) s = c>d ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if (c>-1) s = s.split(",").length>2 ? s.replace(/,/g,"") : s.replace(",",".");
  const x=parseFloat(s); return isFinite(x)?x:0;
}
function parseDate(v){
  if (typeof v==="number" && v>20000 && v<80000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v??"").trim(); let m;
  if ((m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if ((m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/))) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
function normType(v, qty){
  const s = norm(v);
  if (!s) return qty<0 ? "sell" : "";
  if (/^(s|sell|short)$|^sprzed|^zbycie|^sell/.test(s)) return "sell";
  if (/^(k|b|buy|kup|long)$|^kupno|^zakup|^nabycie|^buy/.test(s)) return "buy";
  if (/wyplat|withdraw/.test(s)) return "withdrawal";
  if (/wplat|deposit|zasilen/.test(s)) return "deposit";
  if (/dywid|divid/.test(s)) return "dividend";
  if (/odset|interest|kupon/.test(s)) return "interest";
  if (/oplat|prowiz|fee|commission/.test(s)) return "fee";
  if (/wymian|exchange|przewalut|^fx$/.test(s)) return "fx";
  return TYPE_LABEL[s] ? s : "";
}

let imp = null;
async function loadXLSX(){
  if (window.XLSX) return window.XLSX;
  await new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload=res; sc.onerror=()=>rej(new Error("nie udało się wczytać czytnika Excela")); document.head.appendChild(sc); });
  return window.XLSX;
}
async function readImportFile(file){
  const info=$("importInfo"); if (info) info.textContent="Czytam plik…";
  const ext=(file.name.split(".").pop()||"").toLowerCase(), sheets={};
  if (["xls","xlsx","xlsm","ods"].includes(ext)){
    const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:"array"});
    for (const n of wb.SheetNames) sheets[n]=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});
  } else sheets[file.name]=csvRows(await file.text());
  startImport(file.name, sheets);
}
function startImport(name, sheets){
  const names=Object.keys(sheets).filter(n=>sheets[n].length);
  if (!names.length){ toast("Plik jest pusty"); return; }
  const sheet=[...names].sort((a,b)=>sheets[b].length-sheets[a].length)[0];
  imp={name, sheets, sheet, headerRow:guessHeader(sheets[sheet]), map:{}, defaults:{type:"", ccy:"PLN", account:acct||""}};
  autoMap(); tab="settings"; render();
}
function guessHeader(rows){ for (let i=0;i<Math.min(rows.length,30);i++){ if (rows[i].filter(c=>typeof c==="string"&&c.trim()).length>=3) return i; } return 0; }
function impHeaders(){ const r=imp.sheets[imp.sheet][imp.headerRow]||[]; return r.map((h,i)=>String(h??"").trim()||`Kolumna ${i+1}`); }
function autoMap(){
  const key="kp-map:"+impHeaders().join("|"), saved=lsGet(key);
  if (saved){ imp.map=saved.map||{}; imp.defaults={...imp.defaults, ...saved.defaults}; return; }
  const hs=impHeaders().map(norm), used=new Set(), map={};
  for (const pass of [0,1]) for (const [f,,syn] of IMP_FIELDS){
    if (map[f]!==undefined) continue;
    const sn=syn.map(norm);
    const i=hs.findIndex((h,j)=>!used.has(j) && h && (pass===0 ? sn.includes(h) : sn.some(x=>x.length>=3 && h.includes(x))));
    if (i>-1){ map[f]=i; used.add(i); } }
  imp.map=map;
}
function impBuild(){
  const m=imp.map, d=imp.defaults, hs=impHeaders().map(norm);
  const tc=hs.indexOf("toccy"), ta=hs.indexOf("toamount");
  const cell=(r,f)=> m[f]===undefined ? "" : r[m[f]];
  const out=[];
  imp.sheets[imp.sheet].slice(imp.headerRow+1).forEach((r,i)=>{
    if (!r.some(c=>String(c).trim())) return;
    const date=parseDate(cell(r,"date"));
    const qtyRaw=pnum(cell(r,"qty")), amtRaw=pnum(cell(r,"amount"));
    const type=normType(cell(r,"type"), qtyRaw) || d.type;
    const ccyCell=String(cell(r,"ccy")||"").toUpperCase().trim();
    const g=(String(cell(r,"price"))+" "+String(cell(r,"amount"))).match(/\b(PLN|USD|EUR|GBP|CHF)\b/i);
    const ccy=CCYS.includes(ccyCell)?ccyCell : g?g[1].toUpperCase() : d.ccy;
    const qty=Math.abs(qtyRaw), amount=Math.abs(amtRaw);
    let price=Math.abs(pnum(cell(r,"price")));
    if (["buy","sell"].includes(type) && !price && qty && amount) price=amount/qty;
    const t={id:uid(), created:Date.now()+i, type, date, account:String(cell(r,"account")||d.account||"").trim(),
      ticker:String(cell(r,"ticker")||"").trim().toUpperCase(), name:String(cell(r,"name")||"").trim(), ccy,
      qty, price, fee:Math.abs(pnum(cell(r,"fee"))), amount, tax:Math.abs(pnum(cell(r,"tax"))),
      fx:pnum(cell(r,"fx"))||(ccy==="PLN"?1:num(settings.fxRates[ccy])),
      toCcy: tc>-1 ? String(r[tc]||"").toUpperCase().trim() : "", toAmount: ta>-1 ? Math.abs(pnum(r[ta])) : 0,
      note:String(cell(r,"note")||"").trim()};
    const err = !date ? "brak daty" : !TYPE_LABEL[type] ? "nieznany typ"
      : type==="fx" && (!t.toCcy||!t.toAmount||!amount) ? "wymiana bez drugiej waluty"
      : ["buy","sell"].includes(type) && (!t.ticker||!qty||!price) ? "brak tickera, ilości lub ceny"
      : !["buy","sell","fx"].includes(type) && !amount ? "brak kwoty" : "";
    out.push({t, err, row:imp.headerRow+i+2});
  });
  return out;
}
function impView(){
  if (!imp) return "";
  const hs=impHeaders(), built=impBuild(), ok=built.filter(x=>!x.err), bad=built.filter(x=>x.err);
  const sel=f=>`<select data-map="${f}"><option value="">—</option>${hs.map((h,i)=>`<option value="${i}" ${imp.map[f]===i?"selected":""}>${esc(h)}</option>`).join("")}</select>`;
  const sheets=Object.keys(imp.sheets);
  return `<section class="panel" id="impPanel"><div class="panel-h"><h2>Dopasuj kolumny</h2><span class="note">${esc(imp.name)}</span><span class="spacer"></span><button class="btn ghost" data-act="impCancel">Anuluj</button></div>
    <div class="form">
      ${sheets.length>1?`<label>Arkusz<select data-imp="sheet">${sheets.map(n=>`<option ${n===imp.sheet?"selected":""}>${esc(n)}</option>`).join("")}</select></label>`:""}
      <label>Wiersz nagłówka<input data-imp="headerRow" inputmode="numeric" value="${imp.headerRow+1}"></label>
      <label>Typ, gdy brak w pliku<select data-imp="type"><option value="">—</option>${Object.entries(TYPE_LABEL).filter(([k])=>k!=="fx").map(([k,v])=>`<option value="${k}" ${imp.defaults.type===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label>Waluta, gdy brak w pliku<select data-imp="ccy">${CCYS.map(c=>`<option ${imp.defaults.ccy===c?"selected":""}>${c}</option>`).join("")}</select></label>
      <label>Konto, gdy brak w pliku<input data-imp="account" list="acctList" value="${esc(imp.defaults.account)}" placeholder="np. mBank"></label>
    </div>
    <div class="form">${IMP_FIELDS.map(([f,l])=>`<label>${l}${sel(f)}</label>`).join("")}</div>
    <p class="note">Gotowe do importu: <b class="num">${ok.length}</b>${bad.length?` · pominę <b class="num">${bad.length}</b> (${esc([...new Set(bad.map(b=>b.err))].join(", "))})`:""}. Kierunek rozpoznaję z kolumny typu (Kupno, K, Buy, Sprzedaż, S, Sell, Dywidenda…) albo ze znaku ilości.</p>
    <div class="tbl-wrap">${txTable(ok.slice(0,8).map(x=>x.t),false)}</div>
    ${bad.length?`<details><summary class="note">Pominięte wiersze</summary><p class="note">${esc(bad.slice(0,40).map(b=>`wiersz ${b.row}: ${b.err}`).join("; "))}</p></details>`:""}
    <div class="row"><button class="btn primary" data-act="impGo" ${ok.length?"":"disabled"}>Importuj ${ok.length} transakcji</button></div></section>`;
}
async function impGo(){
  const ok=impBuild().filter(x=>!x.err).map(x=>x.t);
  lsSet("kp-map:"+impHeaders().join("|"), {map:imp.map, defaults:{type:imp.defaults.type, ccy:imp.defaults.ccy, account:imp.defaults.account}});
  imp=null; await putMany(ok); tab="txs"; render(); toast(`Zaimportowano ${ok.length} transakcji`);
}
async function putMany(list){
  if (store===Local){ txs.push(...list); lsSave(); render(); return; }
  for (let i=0;i<list.length;i+=8) await Promise.all(list.slice(i,i+8).map(t=>store.putTx(t)));
}
async function doExport(){
  const csv = toCSV([...txs].sort((a,b)=>a.date.localeCompare(b.date)));
  const inArtifact = !!(window.claude && window.claude.use);
  if (inArtifact){
    const dl = await window.claude.use("downloads");
    if (dl){ try { await dl.save({filename:`portfel-${today()}.csv`, data:new Blob([csv],{type:"text/csv"})}); return; } catch(e){} }
  } else {
    try { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`portfel-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove(); toast("Pobrano CSV"); return; } catch(e){}
  }
  $("csvText").value = csv; toast("CSV jest w polu tekstowym, skopiuj je");
}

/* ---------- events ---------- */
let toastT; function toast(m, action){ let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=m; if(action){ const b=document.createElement("button"); b.textContent=action.label; b.onclick=()=>{ el.hidden=true; action.run(); }; el.append(b); }
  el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true, action?6000:2600); }
document.querySelector("nav.tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){tab=b.dataset.tab; render();} });
$("acctFilter").addEventListener("change", e=>{ acct=e.target.value; render(); });
$("addTxBtn").onclick = ()=>{ if(store) openTx(); };
$("fab").onclick = ()=>{ if(store) openTx(); };
document.addEventListener("keydown", e=>{ if (e.key==="n" && !e.metaKey && !e.ctrlKey && !dlg.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && store){ e.preventDefault(); openTx(); } });
let wipeArmed=false;
app.addEventListener("click", async e=>{
  if (!store){ toast("Chwila, łączę się z zapisem danych"); return; }
  const tt = e.target.closest("[data-txtype]"); if (tt){ txType=tt.dataset.txtype; render(); return; }
  const go = e.target.closest("[data-tab-go]"); if (go){ tab=go.dataset.tabGo; render(); return; }
  const ed = e.target.closest("[data-edit]"); if (ed){ openTx(txs.find(t=>t.id===ed.dataset.edit)); return; }
  const del = e.target.closest("[data-del]");
  if (del){ const old=txs.find(t=>t.id===del.dataset.del); await store.delTx(del.dataset.del); toast("Usunięto transakcję", {label:"Cofnij", run:()=>store.putTx(old)}); return; }
  const act = e.target.closest("[data-act]")?.dataset.act; if (!act) return;
  if (act==="add") openTx();
  if (act==="demo") loadDemo();
  if (act==="goimport"){ tab="settings"; render(); }
  if (act==="pasteImport"){ const tx=$("csvText").value; if(!tx.trim()){ toast("Wklej najpierw dane"); return; } startImport("wklejone dane", {"wklejone dane": csvRows(tx.trim())}); }
  if (act==="impCancel"){ imp=null; render(); }
  if (act==="impGo") impGo();
  if (act==="export") doExport();
  if (act==="addTarget"){ const k=$("newTarget").value.trim().toUpperCase(); if(k){ settings.targets[k]=settings.targets[k]||0; store.saveSettings(); render(); } }
  if (act==="wipe"){ if(!wipeArmed){ wipeArmed=true; $("wipeConfirm").textContent="Kliknij jeszcze raz, żeby usunąć "+txs.length+" transakcji."; return; }
    wipeArmed=false; const ids=txs.map(t=>t.id); if(store===Local){txs=[];lsSave();render();} else { for(let i=0;i<ids.length;i+=8) await Promise.all(ids.slice(i,i+8).map(id=>store.delTx(id))); } toast("Usunięto wszystkie transakcje"); }
});
app.addEventListener("change", e=>{
  if (!store) return;
  const el=e.target;
  if (el.id==="impFile" && el.files[0]){ readImportFile(el.files[0]).catch(err=>toast("Nie udało się odczytać pliku: "+(err.message||err))); return; }
  if (el.dataset.map!==undefined && imp){ imp.map[el.dataset.map] = el.value==="" ? undefined : +el.value; render(); return; }
  if (el.dataset.imp && imp){ const k=el.dataset.imp;
    if (k==="sheet"){ imp.sheet=el.value; imp.headerRow=guessHeader(imp.sheets[imp.sheet]); autoMap(); }
    else if (k==="headerRow"){ imp.headerRow=Math.max(0,(parseInt(el.value,10)||1)-1); autoMap(); }
    else imp.defaults[k]=el.value;
    render(); return; }
  if (el.dataset.price!==undefined){ const v=num(el.value); if(v>0) settings.prices[el.dataset.price]={price:v,date:today()}; else delete settings.prices[el.dataset.price]; store.saveSettings(); render(); }
  if (el.dataset.target!==undefined){ const v=num(el.value); if(v>0) settings.targets[el.dataset.target]=v; else delete settings.targets[el.dataset.target]; store.saveSettings(); render(); }
  if (el.dataset.fxrate){ const v=num(el.value); if(v>0){ settings.fxRates[el.dataset.fxrate]=v; store.saveSettings(); toast("Zapisano kurs "+el.dataset.fxrate); } }
  if (el.id==="splitIn"){ splitAmt=el.value; render(); return; }
  if (el.id==="bandIn"){ settings.band=Math.max(0.5,num(el.value)||5); store.saveSettings(); render(); }
});
app.addEventListener("input", e=>{ if(e.target.id==="txSearch"){ txQuery=e.target.value; const pos=e.target.selectionStart; render(); const s=$("txSearch"); s.focus(); s.setSelectionRange(pos,pos);} });
app.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.classList.contains("cell-in")) e.target.blur(); });

/* ---------- boot ---------- */
render();
connectDb().then(api => {
  if (api){ store = api; } else { store = Local; lsLoad(); setStore(Local.name,true); }
  render();
}).catch(() => { store = Local; lsLoad(); setStore(Local.name,true); render(); });
})();
